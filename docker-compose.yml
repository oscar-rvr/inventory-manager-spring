version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: managementDB
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: i2345678
    volumes:
      - pgdata:/var/lib/postgresql/data

  users-service:
    build:
      context: ./users-service
    container_name: users-service
    ports:
      - "8083:8083"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/managementDB
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: i2345678
      SPRING_PROFILES_ACTIVE: docker

  employees-service:
    build:
      context: ./employees-service
    container_name: employees-service
    ports:
      - "8082:8082"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/managementDB
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: i2345678
      SPRING_PROFILES_ACTIVE: docker

volumes:
  pgdata:
